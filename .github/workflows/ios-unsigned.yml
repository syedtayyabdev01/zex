name: iOS unsigned test IPA

on:
  push:
    branches: [main]
    tags: [ios-v*]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iPhone app
        run: xcodebuild -project ios/ZEX.xcodeproj -scheme ZEX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/derived CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/derived/Build/Products/Release-iphoneos/ZEX.app build/Payload/ZEX.app
          cd build
          zip -qr ZEX-iOS-v0.1.4-UNSIGNED.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ZEX-iOS-v0.1.4-UNSIGNED-IPA
          path: build/ZEX-iOS-v0.1.4-UNSIGNED.ipa
      - name: Attach unsigned IPA to GitHub release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          name: ZEX iOS v0.1.4 (TrollStore test build)
          files: build/ZEX-iOS-v0.1.4-UNSIGNED.ipa
