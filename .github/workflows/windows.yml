name: Windows PC app

on:
  push:
    branches: [main]
    tags: [pc-v*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Windows x64 app
        run: dotnet publish desktop/Zex.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o desktop/publish
      - name: Package app
        run: Compress-Archive -Path desktop/publish/* -DestinationPath ZEX-PC-v0.1.1-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ZEX-PC-v0.1.0-win-x64
          path: ZEX-PC-v0.1.0-win-x64.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/pc-v')
        uses: softprops/action-gh-release@v2
        with:
          name: ZEX PC V0.1.1
          files: ZEX-PC-v0.1.0-win-x64.zip
